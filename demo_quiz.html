<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>動作確認用サンプルeラーニング - 情報セキュリティ基礎テスト</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Meiryo, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      margin: 0;
      padding: 40px 16px;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 14px;
      padding: 28px 32px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }
    .progress {
      font-size: 13px;
      font-weight: 700;
      color: #059669;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 18px;
    }
    .question-text {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.6;
      margin-bottom: 18px;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 22px;
    }
    .option-label, .choice-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 15px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #f8fafc;
      cursor: pointer;
      font-size: 15px;
      text-align: left;
      transition: background 0.15s, border-color 0.15s;
    }
    .option-label:hover, .choice-btn:hover {
      background: #ecfdf5;
      border-color: #10b981;
    }
    .feedback {
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 14.5px;
      line-height: 1.5;
    }
    .feedback.ok {
      background: #ecfdf5;
      border: 1px solid #6ee7b7;
      color: #065f46;
    }
    .feedback.ng {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #991b1b;
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .btn {
      padding: 10px 22px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
    .btn-submit {
      background: #2563eb;
      color: #fff;
    }
    .btn-next {
      background: #059669;
      color: #fff;
    }
    .note {
      margin-top: 24px;
      font-size: 12.5px;
      color: #64748b;
      border-top: 1px solid #e2e8f0;
      padding-top: 12px;
    }
  </style>
</head>
<body>
  <main class="container" id="quizApp"></main>

  <script>
    const questions = [
      {
        type: "radio",
        title: "第1問（単一選択・ラジオボタン）",
        question: "フィッシングメールへの対策として、最も適切な行動は次のうちどれですか？",
        options: [
          "メール内のリンクをすぐにクリックしてパスワードを入力する",
          "不審なメールのURLは開かず、公式ブックマークや公式アプリからアクセスして確認する",
          "添付されている .exe ファイルをとりあえず実行して中身を確かめる",
          "差出人の表示名が有名企業であれば無条件で信用する"
        ],
        answer: [1]
      },
      {
        type: "checkbox",
        title: "第2問（複数選択・チェックボックス）",
        question: "パスワード管理のベストプラクティスとして適切なものを【すべて】選んでください。",
        options: [
          "サービスごとに異なる推測されにくいパスワードを設定する",
          "多要素認証（2段階認証）が利用できる場合は有効にする",
          "付箋にパスワードを書いてモニターの枠に貼っておく",
          "全社員で共通のパスワード「password123」を使い回す"
        ],
        answer: [0, 1]
      },
      {
        type: "button-choice",
        title: "第3問（クリック即判定ボタン形式）",
        question: "Webサイトとブラウザ間の通信を暗号化するプロトコルはどれですか？",
        options: [
          "HTTP（暗号化なし）",
          "HTTPS（TLS/SSLによる暗号化通信）",
          "FTP（平文ファイル転送）",
          "Telnet"
        ],
        answer: [1]
      }
    ];

    let idx = 0;
    let score = 0;
    let phase = "question"; // "question" | "explanation" | "done"
    let lastCorrect = false;

    const app = document.getElementById("quizApp");

    function render() {
      if (phase === "done") {
        app.innerHTML = `
          <div class="progress">テスト終了</div>
          <h1>🎉 全問完了しました！</h1>
          <div class="feedback ok">
            あなたのスコア: <strong>${score} / ${questions.length} 問正解</strong><br/>
            合格基準を満たしました。受講完了です。
          </div>
        `;
        return;
      }

      const q = questions[idx];
      let optionsHtml = "";

      if (q.type === "radio" || q.type === "checkbox") {
        optionsHtml = `
          <div class="options">
            ${q.options
              .map(
                (opt, i) => `
              <label class="option-label">
                <input type="${q.type}" name="q_${idx}" value="${i}" ${phase === "explanation" ? "disabled" : ""} />
                <span>${opt}</span>
              </label>
            `
              )
              .join("")}
          </div>
        `;
      } else {
        optionsHtml = `
          <div class="options">
            ${q.options
              .map(
                (opt, i) => `
              <button type="button" class="choice-btn" data-idx="${i}" ${phase === "explanation" ? "disabled" : ""}>
                ${opt}
              </button>
            `
              )
              .join("")}
          </div>
        `;
      }

      const feedbackHtml =
        phase === "explanation"
          ? `<div class="feedback ${lastCorrect ? "ok" : "ng"}">
              ${lastCorrect ? "⭕ 正解です！" : "❌ 不正解です。"} 次の問題へ進んでください。
             </div>`
          : "";

      const actionHtml =
        phase === "question"
          ? q.type !== "button-choice"
            ? `<div class="actions"><button class="btn btn-submit" id="submitBtn">解答する</button></div>`
            : ""
          : `<div class="actions"><button class="btn btn-next" id="nextBtn">${
              idx + 1 < questions.length ? "次の問題へ" : "結果を見る"
            }</button></div>`;

      app.innerHTML = `
        <div class="progress">進捗: ${idx + 1} / ${questions.length}</div>
        <h1>${q.title}</h1>
        <div class="question-text">${q.question}</div>
        ${optionsHtml}
        ${feedbackHtml}
        ${actionHtml}
        <div class="note">
          ※ このローカルファイル (<code>file://</code>) でテストする場合は、<code>chrome://extensions</code> の「e-learning Killer → 詳細」から<strong>「ファイルの URL へのアクセスを許可する」</strong>をONにしてください。
        </div>
      `;

      if (phase === "question" && q.type === "button-choice") {
        app.querySelectorAll(".choice-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const chosen = [Number(btn.dataset.idx)];
            evaluate(chosen);
          });
        });
      }

      const submitBtn = document.getElementById("submitBtn");
      if (submitBtn) {
        submitBtn.addEventListener("click", () => {
          const checked = Array.from(app.querySelectorAll("input:checked")).map((el) =>
            Number(el.value)
          );
          if (checked.length === 0) {
            alert("選択肢を選んでください");
            return;
          }
          evaluate(checked);
        });
      }

      const nextBtn = document.getElementById("nextBtn");
      if (nextBtn) {
        nextBtn.addEventListener("click", () => {
          idx += 1;
          if (idx >= questions.length) {
            phase = "done";
          } else {
            phase = "question";
          }
          render();
        });
      }
    }

    function evaluate(chosen) {
      const ans = questions[idx].answer;
      lastCorrect =
        chosen.length === ans.length && ans.every((v) => chosen.includes(v));
      if (lastCorrect) score += 1;
      phase = "explanation";
      render();
    }

    render();
  </script>
</body>
</html>
